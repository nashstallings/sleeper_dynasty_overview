name: Refresh NFL Byes

on:
  schedule:
    # Weekly, Wednesday 15:17 UTC. Byes are set once the schedule is
    # published and essentially never change, so this just needs to catch
    # the season's schedule going live and pick up next season's each year.
    #
    # It reads nflreadpy.schedules, which fantasy_football's NFL Data Weekly
    # Refresh writes on Tuesdays at 13:00 UTC. It used to run Tuesday 10:00,
    # before that job, so it always read the previous week's table and a newly
    # published schedule reached the site a week late. A full day after is
    # deliberate: cron has run hours late on this account, and a same-day
    # slot could still land before the data job does. 15:17 also sits ten
    # minutes after the last of the daily dashboard jobs, so their commits
    # don't collide.
    - cron: '17 15 * * 3'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh nfl_byes.json
        run: python scripts/refresh_nfl_byes.py
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_byes.json
          git diff --cached --quiet || git commit -m "Refresh NFL bye weeks"
          git pull --rebase origin main
          git push
