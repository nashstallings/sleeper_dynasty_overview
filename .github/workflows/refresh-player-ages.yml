name: Refresh Player Ages

on:
  schedule:
    # Daily, about two hours after fantasy_football's NFL Data Players Daily
    # (12:37 UTC) rewrites nflreadpy.players, so today's signings and cuts are
    # in today's JSON. The four dashboard jobs are staggered ten minutes apart
    # so their commits don't collide.
    #
    # GitHub cron is best-effort and has run hours late on this account. If
    # this fires before the players refresh lands, it reads yesterday's roster
    # and the next day's run catches up -- never more than a day behind.
    - cron: '7 15 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh player_ages.json
        run: python scripts/refresh_player_ages.py
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/player_ages.json
          # generated_at changes on every run, so a plain `diff --quiet` commits
          # daily even when nothing else did. -I ignores hunks where every
          # changed line matches, so a timestamp-only run commits nothing.
          # (Nothing in app.js reads generated_at.)
          if git diff --cached --quiet -I '"generated_at"'; then
            echo "Only generated_at changed; nothing to commit."
            exit 0
          fi
          git commit -m "Refresh player ages"
          # Several jobs commit to main around the same time now; retry the
          # rebase+push a couple of times rather than lose a day to a race.
          n=0
          until git pull --rebase origin main && git push; do
            n=$((n+1))
            [ "$n" -ge 3 ] && exit 1
            sleep $((n*10))
          done
