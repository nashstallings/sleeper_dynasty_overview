name: Refresh Player News

on:
  schedule:
    # Daily at 13:00 UTC — news is time-sensitive, unlike the weekly stats refresh
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Refresh player_news.json
        run: python scripts/refresh_player_news.py
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/player_news.json
          git diff --cached --quiet || git commit -m "Refresh player news"
          git push
